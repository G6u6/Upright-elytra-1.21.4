name: build
on: workflow_dispatch
jobs: {build: {runs-on: ubuntu-latest, steps: [{uses: "actions/checkout@v4"}, {uses: "actions/setup-java@v4", with: {distribution: temurin, java-version: 21}}, {uses: "gradle/actions/setup-gradle@v4", with: {gradle-version: "8.12"}}, {run: gradle build}, {uses: "actions/upload-artifact@v4", with: {name: elytra-upright-jar, path: "build/libs/elytra-upright-1.0.1.jar"}}]}}
